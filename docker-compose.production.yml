version: " 3.8\

services:
 api:
 build: .
 restart: always
 environment:
 - NODE_ENV=production
 - API_PORT=3001
 deploy:
 resources:
 limits:
 cpus: \0.50\
 memory: 512M
 healthcheck:
 test: [\CMD\, \curl\, \-f\, \http://localhost:3001/health\]
 interval: 30s
 timeout: 10s
 retries: 3

 worker:
 build: .
 restart: always
 environment:
 - NODE_ENV=production
 deploy:
 resources:
 limits:
 cpus: \0.50\
 memory: 512M

 postgres:
 image: postgres:15-alpine
 restart: always
 volumes:
 - pgdata:/var/lib/postgresql/data
 environment:
 - POSTGRES_PASSWORD=
 healthcheck:
 test: [\CMD-SHELL\, \pg_isready -U postgres\]
 interval: 10s
 timeout: 5s
 retries: 5

 redis:
 image: redis:alpine
 restart: always
 volumes:
 - redisdata:/data

volumes:
 pgdata:
 redisdata:
